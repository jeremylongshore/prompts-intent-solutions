name: Template Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-templates:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Validate file naming conventions
      run: python tools/validate_filenames.py

    - name: Validate YAML frontmatter
      run: python tools/validate_frontmatter.py

    - name: Validate repository structure
      run: python tools/validate_structure.py

    - name: Check for duplicates
      run: python tools/check_duplicates.py

    - name: Validate markdown syntax
      uses: DavidAnson/markdownlint-cli2-action@v20
      with:
        globs: '**/*.md'
        config: '.markdownlint.json'

    - name: Generate validation report
      run: |
        echo "## Template Validation Report" >> $GITHUB_STEP_SUMMARY
        echo "✅ All validation checks passed successfully" >> $GITHUB_STEP_SUMMARY
        echo "- Filename conventions: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- YAML frontmatter: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Repository structure: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Duplicate detection: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Markdown syntax: ✅" >> $GITHUB_STEP_SUMMARY